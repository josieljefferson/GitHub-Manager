name: 🗑️ Gerenciar Repositórios GitHub

on:

  workflow_dispatch:

    inputs:

      repositorios:
        description: 'Números dos repositórios. Ex: 1,3,5-8 ou todos'
        required: true
        default: ''

      confirmacao:
        description: 'Digite EXCLUIR para confirmar'
        required: true
        default: ''

permissions:
  contents: read

jobs:

  gerenciar:

    name: 🗑️ Excluir repositórios selecionados

    runs-on: ubuntu-latest

    steps:

      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🗑️ Executar gerenciador
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECAO_REPOSITORIOS: ${{ inputs.repositorios }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          python scripts/github_manager.py
